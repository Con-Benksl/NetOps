name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # A fixed CI epoch makes same-run artifact comparison deterministic. Tagged
  # releases should use the tag commit timestamp documented in README.md.
  SOURCE_DATE_EPOCH: "1720000000"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux archive test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y acl attr
      - name: Install pinned release tooling
        run: >-
          python -m pip install --disable-pip-version-check
          "setuptools==83.0.0" "build==1.3.0" "jsonschema==4.25.1"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Skill structure
        run: python scripts/validate_skills.py .
      - name: Secret scan
        run: python scripts/check_secrets.py .
      - name: Install tree
        run: python scripts/check_install_tree.py .
      - name: Release integrity
        run: python scripts/release_check.py . --require-jsonschema
      - name: Build and verify reproducible release artifacts
        run: >-
          python scripts/reproducible_build.py .
          --source-date-epoch ${{ env.SOURCE_DATE_EPOCH }}
          --output-dir dist
      - name: Fresh-install artifact smoke tests
        run: python scripts/package_smoke.py . --dist-dir dist
