[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-skill"
version = "0.5.1"
description = "Beginner-first VPS network and proxy diagnostics for the NetOps skill collection"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
authors = [{name = "Con-Benksl"}]
dependencies = []

[project.scripts]
netopsctl = "netops_core.cli:main"

[tool.setuptools]
packages = ["netops_core"]
