[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-skill"
version = "0.1.0"
description = "Beginner-first VPS network and proxy diagnostics for the NetOps skill collection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Con-Benksl"}]
dependencies = []

[project.scripts]
netopsctl = "netops_core.cli:main"

[tool.setuptools]
packages = ["netops_core"]
